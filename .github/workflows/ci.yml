name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check the generated classifiers
        run: python3 tools/classifiers/generate.py --target node --check

      - name: Test the classifier generator
        run: python3 -m unittest discover -s tools/classifiers -p 'test_*.py'

      - name: Run tests
        # No API key is set - offline tests must pass without any network calls.
        run: npm test

      - name: Build
        run: npm run build
